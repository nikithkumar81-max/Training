<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Candidate List</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
  <h1>Candidate List</h1>
</div>

<div class="container">
  <h2>All Candidates</h2>

  <table>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Skills</th>
      <th>Education</th>
      <th>Resume</th>
      <th>Action</th>
    </tr>

    <tr th:each="c : ${candidates}">
      <td th:text="${c.id}"></td>
      <td th:text="${c.fullName}"></td>
      <td th:text="${c.email}"></td>
      <td th:text="${c.phone}"></td>
      <td th:text="${c.skills}"></td>
      <td th:text="${c.education}"></td>
      <td th:text="${c.resume}"></td>
      <td>
        <a th:href="@{/candidates/delete/{id}(id=${c.id})}" class="btn btn-danger">Delete</a>
      </td>
    </tr>
  </table>

  <br>
  <a href="/" class="btn btn-secondary">Back to Home</a>
</div>

</body>
</html>
